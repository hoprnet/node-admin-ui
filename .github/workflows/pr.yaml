---
name: PR
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review

concurrency:
  group: ${{ github.event.pull_request.head.ref }}-pr
  cancel-in-progress: true

permissions: {}

jobs:
  validate-pr-title:
    name: Validate title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            docs
            style
            refactor
            perf
            test
            ci
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request

  label:
    name: Add labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/labeler@77a4082b841706ac431479b7e2bb11216ffef250 # main on 20.02.2025
        with:
          sync-labels: true

  checks:
    name: Checks
    uses: ./.github/workflows/checks.yaml
    permissions:
      contents: read

  docker:
    name: Docker
    needs: checks
    uses: ./.github/workflows/docker.yaml
    permissions:
      contents: read
      packages: write
    with:
      # PRs from other forks get a read-only token, so they only build the image.
      push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
